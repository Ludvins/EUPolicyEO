name: Publish approved Pages release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Approved GitHub Release tag
        required: true
        type: string
      archive_sha256:
        description: SHA-256 of eupolicyeo-pages.zip
        required: true
        type: string

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref_protected
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
        id: pages
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
      - name: Download exact release and stage checked assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,79}$ ]]
          [[ "$ARCHIVE_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
          gh release download "$RELEASE_TAG" --pattern eupolicyeo-pages.zip --dir "$RUNNER_TEMP"
          uv run --locked python scripts/prepare_pages.py \
            --archive "$RUNNER_TEMP/eupolicyeo-pages.zip" \
            --sha256 "$ARCHIVE_SHA256" \
            --git-revision "$GITHUB_SHA"
      - run: uv run --locked pytest -q
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web exec -- playwright install --with-deps chromium
      - name: Build and test under Pages base path
        env:
          CONFIGURED_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          export PAGES_BASE="${CONFIGURED_BASE%/}/"
          npm --prefix web run build
          uv run --locked python scripts/check_dist.py
          E2E_REPORT="$RUNNER_TEMP/browser-release.json" npm --prefix web run test:e2e
          cat "$RUNNER_TEMP/browser-release.json"
          touch web/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved assets
        id: deployment
        uses: actions/deploy-pages@v4
